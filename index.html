<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DROXILO SHOP | Toji Fushiguro Oversized Hoodie</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ds-black: #0a0a0a;
            --ds-card-bg: #141414;
            --ds-gold-primary: #d4af37;
            --ds-gold-hover: #f3e5ab;
            --ds-text: #ffffff;
            --ds-text-muted: #a0a0a0;
            --ds-green: #2ecc71;
            --ds-border: rgba(212, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--ds-black);
            color: var(--ds-text);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid var(--ds-border);
            background-color: rgba(0,0,0,0.8);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--ds-gold-primary);
            text-transform: uppercase;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .product-card {
            background-color: var(--ds-card-bg);
            border-radius: 12px;
            border: 1px solid var(--ds-border);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        .product-main-image {
            width: 100%;
            background-color: #000;
            border-bottom: 1px solid var(--ds-border);
        }

        .product-main-image img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .gallery-grid img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--ds-border);
        }

        .product-details {
            padding: 20px;
            text-align: center;
        }

        .product-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--ds-text);
        }

        .product-subtitle {
            color: var(--ds-gold-primary);
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .badge-list {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
            font-size: 0.85rem;
            color: var(--ds-text-muted);
        }

        .badge-item {
            background: rgba(255,255,255,0.05);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .price-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--ds-gold-primary);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }

        .price-amount {
            font-size: 2rem;
            font-weight: 900;
            color: var(--ds-gold-primary);
        }

        .shipping-badge {
            display: block;
            margin-top: 5px;
            color: var(--ds-green);
            font-weight: 700;
            font-size: 0.95rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: right;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--ds-text);
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background-color: #0d0d0d;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--ds-gold-primary);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .btn-submit {
            background-color: var(--ds-gold-primary);
            color: #000;
            font-size: 1.2rem;
            font-weight: 800;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--ds-gold-hover);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: var(--ds-text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DROXILO SHOP</div>
    </header>

    <div class="container">
        <div class="product-card">
            
            <!-- الصورة الرئيسية -->
            <div class="product-main-image">
                <img src="LWL.jpg" alt="Toji Fushiguro Oversized Hoodie">
            </div>

            <div class="product-details">
                <div class="product-subtitle">EDITION LIMITÉE | Toji Fushiguro</div>
                <h1 class="product-title">Oversized Hoodie 320g - Washed Black</h1>
                
                <!-- الصور الإضافية -->
                <div class="gallery-grid">
                    <img src="222.jpg" alt="Detail 1">
                    <img src="9TN.jpg" alt="Detail 2">
                </div>

                <div class="badge-list">
                    <span class="badge-item">100% Coton</span>
                    <span class="badge-item">Coupe Oversized</span>
                    <span class="badge-item">DTF Print Haute Qualité</span>
                </div>

                <div class="price-box">
                    <div class="price-amount">280 DH</div>
                    <div class="shipping-badge">✓ التوصيل مجاني لجميع المدن المغربية والدفع عند الاستلام</div>
                </div>

                <form action="https://formspree.io/f/xqppbnpr" method="POST">
                    <div class="form-group">
                        <label for="fullname">الاسم الكامل:</label>
                        <input type="text" id="fullname" name="fullname" placeholder="أدخل اسمك الكامل" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">رقم الهاتف (الواتساب):</label>
                        <input type="tel" id="phone" name="phone" placeholder="06XXXXXXXX" required>
                    </div>

                    <div class="form-group">
                        <label for="city">المدينة:</label>
                        <input type="text" id="city" name="city" placeholder="مدينتك" required>
                    </div>

                    <div class="form-group">
                        <label for="address">العنوان الكامل:</label>
                        <input type="text" id="address" name="address" placeholder="الحي / الشارع / رقم المنزل" required>
                    </div>

                    <div class="form-group">
                        <label for="size">المقاس (Taille):</label>
                        <select id="size" name="size" required>
                            <option value="" disabled selected>اختر المقاس المناسب</option>
                            <option value="S">S - Small</option>
                            <option value="M">M - Medium</option>
                            <option value="L">L - Large</option>
                            <option value="XL">XL - Extra Large</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">تأكيد الطلب الآن</button>
                </form>
            </div>
        </div>

        <footer>
            <p>© 2026 DROXILO SHOP. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
